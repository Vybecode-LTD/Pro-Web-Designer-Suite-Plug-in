# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reads this file from each PR's branch. The instructions restate CLAUDE.md's conventions.
language: en-GB
reviews:
  profile: assertive
  poem: false
  path_filters:
    - "!**/package-lock.json"
    - "!dev plans/web-design-suite-review/fixtures/**"
  path_instructions:
    - path: "plugins/web-design-suite/**"
      instructions: |
        Every bug fix needs a regression test in tests/ that fails on the previous release (the suite run with WDS_PLUGIN_ROOT pointed at that release's tag) and passes now. Flag a fix that adds no test, or whose test would also pass before the fix.
    - path: "plugins/web-design-suite/**/*.py"
      instructions: |
        Standard library only: flag any third-party import. The floor is Python 3.10, so flag syntax or library APIs newer than 3.10.
    - path: "plugins/web-design-suite/tests/**/*.py"
      instructions: |
        Every subprocess a test starts must pass env=env(...) from tests/wds_support.py, which gives it the harness's environment without git's repository variables. Flag a subprocess call without it.
    - path: "plugins/web-design-suite/skills/**/SKILL.md"
      instructions: |
        A SKILL.md must stay at or under 20,500 bytes (tests/test_skill_budget.py). A figure from outside the plugin must be registered, with its quote, in tests/fixtures/evidence.json.
    - path: "plugins/web-design-suite/skills/**/references/**"
      instructions: |
        A reference must stay under 60.5 KB (tests/test_skill_budget.py). A figure from outside the plugin must be registered, with its quote, in tests/fixtures/evidence.json.
    - path: "plugins/web-design-suite/skills/web-design-studio/assets/**"
      instructions: |
        One set of rules: a gate change goes into assets/rules/design-rules.json first, then the audit (scripts/audit_design.py), the stylelint config and the ESLint config follow, each with a real-tool test in tests/test_real_tools.py. Flag a gate changed in one of these but not the others.
    - path: "plugins/web-design-suite/skills/web-design-studio/scripts/audit_design.py"
      instructions: |
        One set of rules: a gate change goes into assets/rules/design-rules.json first, then this audit, the stylelint config and the ESLint config follow, each with a real-tool test in tests/test_real_tools.py. Flag a gate changed here but not in the others.
    - path: "tooling/**/*.py"
      instructions: |
        Standard library only, on the same Python floor as the plugin (3.10). Every bug fix needs a regression test (the zip builder's are in plugins/web-design-suite/tests/test_release_zip.py) that fails before the fix and passes after.
    - path: "dev plans/**/*.md"
      instructions: |
        Commands written for the maintainer to run must work in cmd.exe.
    - path: "docs/**/*.md"
      instructions: |
        Commands written for the maintainer to run must work in cmd.exe.
