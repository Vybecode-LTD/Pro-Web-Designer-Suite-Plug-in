<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title">
<title id="title">Where drift gets caught: Claude's edit, the commit, the pull request, the release</title>
<desc>1, Claude edits a file: the opt-in hooks run the design audit, the static accessibility check, the token diff, the email build and the generated-file guard. 2, you commit: the pre-commit hook runs stylelint, ESLint, the design audit, the static accessibility check and role contrast. 3, a pull request or a push to main: design-gates.yml runs the design audit and the accessibility and performance gates, static and in a browser, on Linux, and the static gates on Windows. 4, you release: release-check diffs the system, classes the change, gates removals, and writes the changelog and migration guide.</desc><style>.sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono','Segoe UI Mono',Consolas,'Liberation Mono',Menlo,monospace}text{font-kerning:normal}</style>
<rect x="0.5" y="0.5" width="1279" height="579" rx="28" fill="#090706" stroke="#2c2826"/>
<text x="64.0" y="78.0" class="mono" font-size="15" font-weight="700" fill="#fe7553" text-anchor="start" letter-spacing="2.5">WHERE DRIFT GETS CAUGHT</text>
<text x="62.0" y="128.0" class="sans" font-size="38" font-weight="800" fill="#fbf8f8" text-anchor="start" letter-spacing="-1">Caught where it starts.</text>
<text x="64.0" y="166.0" class="sans" font-size="20" font-weight="400" fill="#d6d1d0" text-anchor="start">The same rules, from Claude's edit to the release: the audit, stylelint and ESLint share one rule spec.</text>
