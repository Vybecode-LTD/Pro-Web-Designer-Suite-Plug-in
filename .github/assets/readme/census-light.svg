<title id="title">The census: 17 greys in, 7 roles out</title>
<desc>The migration's census of a three-file sample found 17 distinct greys; the proposal maps them onto seven roles: fg-default, fg-muted, fg-subtle, fg-disabled, border-strong, border-default and border-subtle.</desc><style>.sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono','Segoe UI Mono',Consolas,'Liberation Mono',Menlo,monospace}text{font-kerning:normal}</style>
