<text x="804.0" y="191.0" class="mono" font-size="14" font-weight="700" fill="#9e2f00" text-anchor="end">12</text>
<text x="772.0" y="326.0" class="mono" font-size="16" font-weight="400" fill="#726b6a" text-anchor="start">padding</text>
<text x="862.0" y="326.0" class="mono" font-size="16" font-weight="400" fill="#171413" text-anchor="start">var(--space-3) var(--space-6)</text>
<text x="772.0" y="354.0" class="mono" font-size="16" font-weight="400" fill="#726b6a" text-anchor="start">radius</text>
<text x="862.0" y="354.0" class="mono" font-size="16" font-weight="400" fill="#171413" text-anchor="start">var(--radius-md)</text>
<text x="772.0" y="382.0" class="mono" font-size="16" font-weight="400" fill="#726b6a" text-anchor="start">fill</text>
<text x="862.0" y="382.0" class="mono" font-size="16" font-weight="400" fill="#171413" text-anchor="start">var(--bg-accent)</text>
<text x="772.0" y="410.0" class="mono" font-size="16" font-weight="400" fill="#726b6a" text-anchor="start">label</text>
<text x="862.0" y="410.0" class="mono" font-size="16" font-weight="400" fill="#171413" text-anchor="start">var(--fg-on-accent)</text>
<line x1="744" y1="428" x2="1216" y2="428" stroke="#e8e4e3"/>
<rect x="772" y="442" width="44" height="44" rx="10" fill="#cc3c00"/>
