<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title">
<title id="title">Pro Web Design Suite: a design system with a gate on it</title>
<desc>A Claude Code plugin. A button's spec at 200%: padding, radius and colour as tokens, its label's contrast measured at 4.98:1, and the accent ramp from 50 to 950.</desc><style>.sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono','Segoe UI Mono',Consolas,'Liberation Mono',Menlo,monospace}text{font-kerning:normal}</style>
<rect x="0.5" y="0.5" width="1279" height="599" rx="28" fill="#fbf8f8" stroke="#d6d1d0"/>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#d6d1d0"/></pattern><linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0.38" stop-color="#fff" stop-opacity="0"/><stop offset="0.72" stop-color="#fff" stop-opacity="1"/></linearGradient><mask id="m"><rect width="1280" height="600" fill="url(#fade)"/></mask><clipPath id="clip"><rect x="0.5" y="0.5" width="1279" height="599" rx="28"/></clipPath><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.08"/></filter></defs>
<g clip-path="url(#clip)"><rect width="1280" height="600" fill="url(#dots)" mask="url(#m)"/></g>
<text x="80.0" y="122.0" class="mono" font-size="15" font-weight="700" fill="#9e2f00" text-anchor="start" letter-spacing="2.5">CLAUDE CODE PLUGIN</text>
<rect x="80" y="140" width="40" height="5" rx="2.5" fill="#cc3c00"/>
<text x="76.0" y="228.0" class="sans" font-size="74" font-weight="800" fill="#090706" text-anchor="start" letter-spacing="-2">Pro Web</text>
<text x="76.0" y="308.0" class="sans" font-size="74" font-weight="800" fill="#090706" text-anchor="start" letter-spacing="-2">Design Suite</text>
<text x="80" y="370" class="sans" font-size="30" font-weight="600" fill="#171413">A design system with a <tspan fill="#9e2f00">gate</tspan> on it.</text>
<text x="80.0" y="416.0" class="sans" font-size="21" font-weight="400" fill="#615b59" text-anchor="start">Tokens, one home for every component's styles,</text>
<text x="80.0" y="448.0" class="sans" font-size="21" font-weight="400" fill="#615b59" text-anchor="start">measured contrast, and gates that fail on drift.</text>
<rect x="80" y="490" width="131.2" height="44" rx="22" fill="#ffffff" stroke="#d6d1d0"/>
<text x="145.6" y="518" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#171413"><tspan fill="#9e2f00">13</tspan> skills</text>
<rect x="223.2" y="490" width="152.8" height="44" rx="22" fill="#ffffff" stroke="#d6d1d0"/>
<text x="299.6" y="518" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#171413"><tspan fill="#9e2f00">16</tspan> commands</text>
<rect x="388.0" y="490" width="152.8" height="44" rx="22" fill="#ffffff" stroke="#d6d1d0"/>
<text x="464.4" y="518" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#171413"><tspan fill="#9e2f00">6</tspan> subagents</text>
<rect x="552.8" y="490" width="163.6" height="44" rx="22" fill="#ffffff" stroke="#d6d1d0"/>
<text x="634.6" y="518" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#171413"><tspan fill="#9e2f00">5</tspan> gate tools</text>
<rect x="744" y="56" width="472" height="500" rx="22" fill="#ffffff" stroke="#d6d1d0" filter="url(#shadow)"/>
<text x="772.0" y="98.0" class="mono" font-size="16" font-weight="400" fill="#726b6a" text-anchor="start">components/button.css</text>
<rect x="1032" y="76" width="156" height="34" rx="17" fill="#d3f5db"/>
<path d="M1048.0 92.3 l5.1 5.1 l9.6 -10.6" fill="none" stroke="#006731" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1072.0" y="99.0" class="mono" font-size="15" font-weight="700" fill="#006731" text-anchor="start">gate: clean</text>
