# A pushed v* tag releases the plugin. This workflow is the only thing that
# creates a GitHub release: it builds the zip and the .skill files from the
# tagged commit, with their SHA-256 sums, and attaches them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history, so the builder can list what was removed since the
      # previous tag.
      # Pinned to commit SHAs: this job holds `contents: write` and GH_TOKEN
      # (the audit's D2, the rule evals.yml follows). gh reads GH_TOKEN, so
      # checkout keeps no credential behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
        with:
          enable-cache: false

      - name: The tag is plugin.json's version
        id: version
        run: |
          version=$(uv run --no-project --python 3.14 python -c "import json; print(json.load(open('plugins/web-design-suite/.claude-plugin/plugin.json', encoding='utf-8'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but plugin.json says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the zip, the .skill files and SHA256SUMS
        run: uv run --no-project --python 3.14 python -B tooling/release/build.py dist --rev "$GITHUB_REF_NAME"

      - name: The release notes are the CHANGELOG's section for this version
        run: |
          uv run --no-project --python 3.14 python - "${{ steps.version.outputs.version }}" > notes.md <<'EOF'
          import re, sys
          text = open("plugins/web-design-suite/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(sys.argv[1]) + r"\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit("the CHANGELOG has no section for " + sys.argv[1])
          print(m.group(1).strip())
          EOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "web-design-suite ${{ steps.version.outputs.version }}" --notes-file notes.md
