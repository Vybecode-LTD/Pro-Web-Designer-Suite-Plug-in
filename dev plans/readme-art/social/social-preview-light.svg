<text x="299.6" y="496" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#171413"><tspan fill="#9e2f00">16</tspan> commands</text>
<rect x="388.0" y="468" width="152.8" height="44" rx="22" fill="#ffffff" stroke="#d6d1d0"/>
<text x="464.4" y="496" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#171413"><tspan fill="#9e2f00">6</tspan> subagents</text>
<rect x="552.8" y="468" width="163.6" height="44" rx="22" fill="#ffffff" stroke="#d6d1d0"/>
<text x="634.6" y="496" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#171413"><tspan fill="#9e2f00">5</tspan> gate tools</text>
<text x="80.0" y="584.0" class="mono" font-size="18" font-weight="400" fill="#615b59" text-anchor="start">github.com/Vybecode-LTD/pro-web-design-suite</text>
<rect x="780" y="85" width="420" height="470" rx="18" fill="#171413" stroke="#2c2826" filter="url(#shadow)"/>
<g clip-path="url(#term)"><rect x="780" y="85" width="420" height="44" fill="#090706"/></g>
<line x1="780" y1="129" x2="1200" y2="129" stroke="#2c2826"/>
<circle cx="804" cy="107" r="6" fill="#e9504d"/>
<circle cx="824" cy="107" r="6" fill="#dba400"/>
<circle cx="844" cy="107" r="6" fill="#259f56"/>
<text x="1020.0" y="113.0" class="mono" font-size="15" font-weight="400" fill="#a8a1a0" text-anchor="middle">audit_design.py --strict</text>
