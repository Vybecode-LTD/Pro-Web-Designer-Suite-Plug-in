<text x="808" y="271" class="mono" font-size="17" xml:space="preserve"><tspan fill="#d6d1d0">z-index</tspan><tspan fill="#a8a1a0">: </tspan><tspan fill="#fbf8f8">999 !important</tspan><tspan fill="#a8a1a0">;</tspan></text>
