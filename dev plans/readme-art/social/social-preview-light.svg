<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title">
<title id="title">Pro Web Design Suite: a design system with a gate on it</title>
<desc>A Claude Code plugin: 13 skills, 16 commands, 6 subagents and 5 gate tools. audit_design.py --strict on card.css: color #333, padding 13px 20px and z-index 999 !important among 10 errors, exit 1; after the fix, on tokens, clean, exit 0.</desc><style>.sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono','Segoe UI Mono',Consolas,'Liberation Mono',Menlo,monospace}text{font-kerning:normal}</style>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#d6d1d0"/></pattern><linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0.45" stop-color="#fff" stop-opacity="0"/><stop offset="0.8" stop-color="#fff" stop-opacity="1"/></linearGradient><mask id="m"><rect width="1280" height="640" fill="url(#fade)"/></mask><clipPath id="term"><rect x="780" y="85" width="420" height="470" rx="18"/></clipPath><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.08"/></filter></defs>
<rect width="1280" height="640" fill="#fbf8f8"/>
<rect width="1280" height="640" fill="url(#dots)" mask="url(#m)"/>
<text x="80.0" y="150.0" class="mono" font-size="18" font-weight="700" fill="#9e2f00" text-anchor="start" letter-spacing="3">CLAUDE CODE PLUGIN</text>
<rect x="80" y="170" width="44" height="6" rx="3" fill="#cc3c00"/>
<text x="75.0" y="262.0" class="sans" font-size="84" font-weight="800" fill="#090706" text-anchor="start" letter-spacing="-2.5">Pro Web</text>
<text x="75.0" y="352.0" class="sans" font-size="84" font-weight="800" fill="#090706" text-anchor="start" letter-spacing="-2.5">Design Suite</text>
<text x="80" y="420" class="sans" font-size="34" font-weight="600" fill="#171413">A design system with a <tspan fill="#9e2f00">gate</tspan> on it.</text>
<rect x="80" y="468" width="131.2" height="44" rx="22" fill="#ffffff" stroke="#d6d1d0"/>
