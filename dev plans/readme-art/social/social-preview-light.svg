<text x="808.0" y="379.0" class="mono" font-size="15" font-weight="400" fill="#a8a1a0" text-anchor="start">after the fix, on tokens</text>
<text x="808" y="417" class="mono" font-size="17" xml:space="preserve"><tspan fill="#d6d1d0">color</tspan><tspan fill="#a8a1a0">: </tspan><tspan fill="#fe7553">var(--fg-muted)</tspan><tspan fill="#a8a1a0">;</tspan></text>
<text x="808" y="451" class="mono" font-size="17" xml:space="preserve"><tspan fill="#d6d1d0">padding</tspan><tspan fill="#a8a1a0">: </tspan><tspan fill="#fe7553">var(--pad-card)</tspan><tspan fill="#a8a1a0">;</tspan></text>
<text x="808" y="485" class="mono" font-size="17" xml:space="preserve"><tspan fill="#d6d1d0">z-index</tspan><tspan fill="#a8a1a0">: </tspan><tspan fill="#fe7553">var(--z-raised)</tspan><tspan fill="#a8a1a0">;</tspan></text>
<path d="M810.0 521.3 l4.5 4.5 l8.4 -9.2" fill="none" stroke="#259f56" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="836.0" y="529.0" class="mono" font-size="19" font-weight="700" fill="#259f56" text-anchor="start">clean</text>
<rect x="1076" y="509" width="96" height="30" rx="15" fill="#0d1f13"/>
<text x="1124.0" y="529.0" class="mono" font-size="15" font-weight="700" fill="#259f56" text-anchor="middle">exit 0</text>
